steps:
  # Installs the plugins at the versions of lazy-lock.json and, for the nightly tag, packages them with the
  # configuration. Every step runs in a fresh container, so installing and packaging is one step
  install:
    # glibc, so the compiled parsers and libraries of the package load on common distributions. The dependencies are
    # the ones of .shrike/neovim.Dockerfile, see .ci/install-deps.sh
    image: debian:trixie-slim

    commands:
      - sh .ci/install-deps.sh || exit 1
      - mkdir -p ~/.config/nvim
      - cp -r ./init.lua ./lua ./after ./lazy-lock.json ~/.config/nvim/ || exit 1
      - nvim --headless +'SyncInstall' +qall || exit 1
      - |
        if [ "$CI_COMMIT_TAG" = nightly ]; then
          export GIT_PATH=$(pwd)
          cd ~/
          tar cvfz $GIT_PATH/neovim-config.tar.gz .local/share/nvim/ .config/nvim
        fi

    when:
      - event: [push, pull_request, manual]
      - event: tag
        ref: refs/tags/nightly

  upload:
    image: woodpeckerci/plugin-github-release:latest

    settings:
      api_key:
        from_secret: github_token
      files: ./neovim-config.tar.gz
      title: 'neovim-config nightly'
      checksum:
        - sha256
        - md5

    when:
      - event: tag
        ref: refs/tags/nightly
